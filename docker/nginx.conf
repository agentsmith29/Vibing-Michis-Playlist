# Reverse proxy: serves the React app and routes API/admin requests to Django.
upstream django {
    server api:8000;
    keepalive 16;
}

# Respect X-Forwarded-Proto from an outer TLS proxy, otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 4g;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.mzstatic.com https://*.ytimg.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # --- Django ------------------------------------------------------------
    location /api/ {
        proxy_pass http://django;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Stream large uploads (zip playlists) straight to Django.
        proxy_request_buffering off;
    }

    location /admin/ {
        proxy_pass http://django;
    }

    location /static/ {
        proxy_pass http://django;
    }

    # --- Protected files ------------------------------------------------------
    # Only reachable through an X-Accel-Redirect from Django after the session
    # was checked. nginx then streams the file with range (seek) support.
    location /_protected/music/ {
        internal;
        alias /music/;
        types { audio/mpeg mp3; audio/mp4 m4a; audio/flac flac; }
    }

    location /_protected/media/ {
        internal;
        alias /media/;
    }

    # --- React app ---------------------------------------------------------------
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
